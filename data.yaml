# Weld Defect Detection Dataset Configuration - Bounding-box Detection
# YOLO detection format: class_id x_center y_center width height

path: C:/workspace/weld-defect-detection/data  # dataset root dir (absolute)
train: train/images  # train images (relative to path)
val: val/images  # val images (relative to path)
test: test/images  # test images (relative to path)

# Classes (3 classes from Kaggle welding defect dataset)
names:
  0: bad_weld
  1: good_weld
  2: defect

# Number of classes
nc: 3
